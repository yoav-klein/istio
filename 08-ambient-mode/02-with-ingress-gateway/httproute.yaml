apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: generator
  namespace: lucky-number-app
spec:
  parentRefs:
  - namespace: istio-system
    name: gateway
  rules:
  - matches:
    - headers:
      - type: Exact
        name: user
        value: john
    backendRefs:
    - name: generator-v2
      port: 5000
  - backendRefs:
    - name: generator-v1
      port: 5000
      weight: 90
    - name: generator-v2
      port: 5000
      weight: 10


