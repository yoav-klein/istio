apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: generator
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: generator
  rules:
  - matches:
    - headers:
      - type: Exact
        name: user
        value: john
    backendRefs:
    - name: generator-v2
      port: 5000
  - backendRefs:
    - name: generator-v1
      port: 5000
      weight: 90
    - name: generator-v2
      port: 5000
      weight: 10


